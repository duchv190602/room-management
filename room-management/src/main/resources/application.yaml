server:
  port: 8080
  servlet:
    context-path: /room-management

spring:
  application:
    name: room-management
  datasource:
    url: "jdbc:mysql://localhost:3306/room_management"
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


jwt:
  secret: "${JWT_SECRET}"
  # Access token expiry in seconds (default: 15 minutes)
  access-token-expiry: 900
  # Refresh token expiry in seconds (default: 7 days)
  refresh-token-expiry: 604800

app:
  cron:
    token-cleanup-expression: "${TOKEN_CLEANUP_CRON:0 0 0 * * ?}"
  init-admin:
    username: "${ADMIN_USERNAME:admin}"
    password: "${ADMIN_PASSWORD:admin123}"
    email: "${ADMIN_EMAIL:admin@example.com}"
    full-name: "${ADMIN_FULL_NAME:System Administrator}"